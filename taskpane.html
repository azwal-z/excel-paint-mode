<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Mode</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f1f1f;
      --muted: #616161;
      --border: #d1d1d1;
      --on: #107c41;
      --off: #8a8886;
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font: 13px "Segoe UI", system-ui, sans-serif;
    }
    #toggle {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      font: 600 14px "Segoe UI", system-ui, sans-serif;
      color: #fff;
      background: var(--off);
      cursor: pointer;
    }
    #toggle.on { background: var(--on); }
    #hint { margin: 4px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
    h2 { font-size: 11px; font-weight: 600; margin: 14px 0 6px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; }
    .grid.theme .swatch:nth-child(-n+10) { margin-bottom: 4px; }
    .swatch {
      width: 18px;
      height: 18px;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0;
      cursor: pointer;
    }
    .swatch:hover { outline: 1px solid var(--text); }
    .swatch.selected { outline: 2px solid var(--text); outline-offset: 1px; }
    .nofill {
      background: linear-gradient(to top right, #fff 45%, #d13438 45%, #d13438 55%, #fff 55%);
    }
    #extras { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    #extras label, #extras button.text {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer;
    }
    #custom { width: 22px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 2px; background: none; cursor: pointer; }
    #current { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--muted); }
    #currentChip { width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 2px; }
    #error { color: #a4262c; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <button id="toggle" type="button">Paint mode: OFF</button>
  <p id="hint">Shortcut: Ctrl + Shift + Z</p>

  <h2>Theme colours</h2>
  <div id="themeGrid" class="grid theme"></div>

  <h2>Standard colours</h2>
  <div id="standardGrid" class="grid"></div>

  <div id="extras">
    <button id="noFill" class="text" type="button">
      <span class="swatch nofill" data-color="none"></span>No fill
    </button>
    <label>
      <input id="custom" type="color" value="#FFFF00">More colours
    </label>
  </div>

  <div id="current">
    <div id="currentChip"></div>
    <span id="currentLabel"></span>
  </div>

  <div id="error"></div>

  <script src="taskpane.js"></script>
</body>
</html>
